name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Match the host-port helper selected by the pinned Testcontainers version.
      SSHD_CONTAINER_IMAGE: testcontainers/sshd:1.4.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node.js and pnpm; install from frozen lockfile
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Prepare Ubuntu package downloads
        run: |
          # The Azure mirror exhausted most of the job budget at about 50 kB/s.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80teluni-ci > /dev/null
      - name: Install Chromium and system libraries for browser checks
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: Install FFmpeg for media processing tests
        # Playwright has already refreshed the package index.
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Pull the Testcontainers host-port helper before parallel fixtures
        timeout-minutes: 5
        run: docker pull "$SSHD_CONTAINER_IMAGE"
      - name: Run repository validation
        env:
          ORION_RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: pnpm validate

  player:
    name: Player
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17 with the Gradle cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/player/gradle/libs.versions.toml
            apps/player/gradle/verification-metadata.xml
            apps/player/gradle/wrapper/gradle-wrapper.properties
            apps/player/**/gradle.lockfile
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install the player Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Check the player
        working-directory: apps/player
        run: ./gradlew --no-daemon check :app:assembleDebug :app:assembleRelease
      - name: Check preconfigured first-install pairing
        working-directory: apps/player
        run: ./gradlew --no-daemon :app:check :app:assembleDebug -PteluniPlayerApiEndpoint=https://player.example.test/api

  deployment:
    name: Deployment rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js and pnpm; install from frozen lockfile
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Build, run, back up and restore the pilot deployment
        run: infra/pilot/rehearsal.sh
      - name: Qualify the isolated presentation bootstrap and verified ingress
        run: infra/presentation/rehearsal.sh

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block newly introduced high and critical vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  required-gate:
    name: Orion required gate
    needs: [validate, player, deployment, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all validation jobs to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLAYER_RESULT: ${{ needs.player.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_REVIEW_ENABLED: ${{ vars.DEPENDENCY_REVIEW_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Validation job concluded: $VALIDATE_RESULT" >&2
            exit 1
          fi
          if [ "$PLAYER_RESULT" != "success" ]; then
            echo "Player job concluded: $PLAYER_RESULT" >&2
            exit 1
          fi
          if [ "$DEPLOYMENT_RESULT" != "success" ]; then
            echo "Deployment rehearsal concluded: $DEPLOYMENT_RESULT" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DEPENDENCY_REVIEW_ENABLED" = "true" ] && [ "$DEPENDENCY_REVIEW_RESULT" != "success" ]; then
            echo "Dependency review concluded: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
